[package]
name = "actdb"
version = "0.1.3"
edition = "2024"
rust-version = "1.89"
description = "A small, embedded, single-file key-value database"
license = "MIT OR Apache-2.0"

[dependencies]
crc32fast = "1.4"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "deny"
